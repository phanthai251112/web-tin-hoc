<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Nộp Bài Tin Học</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; color: #333; }
        
        /* Khung chính */
        .container { background: white; width: 100%; max-width: 900px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); overflow: hidden; margin: 20px; min-height: 500px; display: flex; flex-direction: column; }
        
        /* Header */
        .header { background: #fff; padding: 20px 40px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; color: #764ba2; font-size: 24px; }
        
        /* Phần nội dung */
        .content { padding: 40px; flex: 1; }

        /* Form đăng nhập đẹp */
        .login-wrapper { max-width: 400px; margin: 0 auto; text-align: center; padding-top: 20px; }
        .login-wrapper h3 { font-size: 28px; color: #333; margin-bottom: 10px; }
        .login-wrapper p { color: #666; margin-bottom: 30px; }
        
        input, textarea { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #e1e1e1; border-radius: 10px; background: #f9f9f9; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #764ba2; background: #fff; outline: none; }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: linear-gradient(to right, #764ba2, #667eea); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(118, 75, 162, 0.6); }
        button.btn-logout { background: #ffebee; color: #d32f2f; width: auto; padding: 8px 20px; box-shadow: none; font-size: 14px; }
        button.btn-logout:hover { background: #ffcdd2; }

        /* Card bài tập */
        .card { background: #fff; border: 1px solid #eee; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .card h4 { margin-top: 0; color: #4a4a4a; font-size: 20px; }
        
        /* Khu vực Admin */
        .admin-panel { background: #f3f0ff; border: 2px dashed #764ba2; padding: 25px; border-radius: 15px; margin-bottom: 30px; }
        .admin-title { color: #764ba2; font-weight: bold; margin-bottom: 15px; display: block; font-size: 18px; }

        .hidden { display: none !important; }
        .error-msg { color: #ff3333; background: #ffe6e6; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📘 Nộp Bài Tin Học</h2>
        <div id="userInfo" class="hidden">
            <span style="margin-right: 10px;">Xin chào, <b id="userDisplay"></b></span>
            <button onclick="logout()" class="btn-logout">Đăng xuất</button>
        </div>
    </div>

    <div class="content">
        <div id="authSection" class="login-wrapper">
            <h3>Đăng Nhập</h3>
            <p>Hệ thống dành cho Học sinh & Giáo viên</p>
            <input type="text" id="loginName" placeholder="Tên đăng nhập (VD: phanthai25)">
            <input type="password" id="loginPass" placeholder="Mật khẩu">
            <button onclick="login()">Vào Hệ Thống</button>
            <div id="loginMsg" class="error-msg"></div>
        </div>

        <div id="adminSection" class="hidden">
            <div class="admin-panel">
                <span class="admin-title">👤 Quản Lý Học Sinh (Cấp Tài Khoản)</span>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="newStudentName" placeholder="Tên HS (VD: hs01)" style="margin-bottom:0">
                    <input type="text" id="newStudentPass" placeholder="Mật khẩu" style="margin-bottom:0">
                    <button onclick="createStudentAccount()" style="width: auto; margin-bottom:0">Tạo</button>
                </div>
                <p id="adminMsg" style="margin-top: 10px; color: green;"></p>
            </div>

            <div class="admin-panel" style="background: #e3f2fd; border-color: #2196f3;">
                <span class="admin-title" style="color: #1565c0;">📝 Đăng Bài Tập Mới</span>
                <input type="text" id="qTitle" placeholder="Tiêu đề bài tập">
                <textarea id="qContent" rows="3" placeholder="Nội dung đề bài..."></textarea>
                <button onclick="postQuestion()" style="background: #1565c0;">Đăng Ngay</button>
            </div>
        </div>

        <div id="mainApp" class="hidden">
            <h3 style="margin-bottom: 20px; color: #555;">Danh sách bài tập hiện có</h3>
            <div id="questionsList">Đang tải dữ liệu...</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- CONFIG CỦA BẠN ---
    const firebaseConfig = {
        apiKey: "AIzaSyBTNqv64uDH4lCqbgYz3_c7YBwA7LCmTMw",
        authDomain: "tinhoc-1845e.firebaseapp.com",
        projectId: "tinhoc-1845e",
        storageBucket: "tinhoc-1845e.firebasestorage.app",
        messagingSenderId: "1057138431640",
        appId: "1:1057138431640:web:a5f7c257f8b3182e7da2ed",
        measurementId: "G-JKRLEH0B2T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const DOMAIN = "@tinoc.com"; // Đuôi email mặc định

    // --- LOGIN ---
    window.login = async () => {
        let name = document.getElementById('loginName').value.trim();
        const pass = document.getElementById('loginPass').value;
        const msgBox = document.getElementById('loginMsg');
        
        if(!name || !pass) return alert("Vui lòng nhập đủ thông tin");

        // Tự động thêm đuôi nếu chưa có
        if (!name.includes("@")) name += DOMAIN;

        msgBox.style.display = 'none';

        try {
            await signInWithEmailAndPassword(auth, name, pass);
        } catch (err) {
            msgBox.style.display = 'block';
            // Báo lỗi chi tiết để bạn biết sai ở đâu
            msgBox.innerHTML = `<b>Đăng nhập thất bại!</b><br>
            Hệ thống đang thử đăng nhập với email: <b>${name}</b><br>
            Lỗi: Mật khẩu sai hoặc Tài khoản này chưa được tạo trên Firebase.`;
        }
    }

    window.logout = () => signOut(auth);

    // --- ADMIN TẠO USER ---
    window.createStudentAccount = async () => {
        const name = document.getElementById('newStudentName').value.trim();
        const pass = document.getElementById('newStudentPass').value.trim();
        if(!name || !pass) return alert("Thiếu thông tin!");

        const fullEmail = name + DOMAIN;
        document.getElementById('adminMsg').innerText = "Đang xử lý...";

        try {
            const tempApp = initializeApp(firebaseConfig, "TempApp");
            const tempAuth = getAuth(tempApp);
            await createUserWithEmailAndPassword(tempAuth, fullEmail, pass);
            await signOut(tempAuth);
            
            document.getElementById('adminMsg').innerText = `✅ Đã tạo thành công: ${name} (Mật khẩu: ${pass})`;
            document.getElementById('newStudentName').value = "";
            document.getElementById('newStudentPass').value = "";
        } catch (e) {
            document.getElementById('adminMsg').innerText = "Lỗi: Tên này đã tồn tại hoặc quá ngắn.";
        }
    }

    // --- APP LOGIC ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            
            const shortName = user.email.replace(DOMAIN, "");
            document.getElementById('userDisplay').innerText = shortName;

            // Check Admin
            if(shortName === "phanthai25" || user.email.includes("admin")) {
                document.getElementById('adminSection').classList.remove('hidden');
            } else {
                document.getElementById('adminSection').classList.add('hidden');
            }
            loadQuestions();
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('adminSection').classList.add('hidden');
        }
    });

    window.postQuestion = async () => {
        const title = document.getElementById('qTitle').value;
        const content = document.getElementById('qContent').value;
        if(!title) return alert("Thiếu tiêu đề");
        
        await addDoc(collection(db, "questions"), {
            title, content, createdAt: serverTimestamp(), createdBy: auth.currentUser.email
        });
        alert("Đã đăng bài!");
        document.getElementById('qTitle').value = "";
        document.getElementById('qContent').value = "";
        loadQuestions();
    }

    async function loadQuestions() {
        const list = document.getElementById('questionsList');
        list.innerHTML = "Đang tải...";
        const q = query(collection(db, "questions"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        list.innerHTML = "";
        
        if(snap.empty) { list.innerHTML = "<p style='text-align:center; color:#999'>Chưa có bài tập nào.</p>"; return; }

        snap.forEach(doc => {
            const d = doc.data();
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <h4>${d.title}</h4>
                <p>${d.content}</p>
                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
                <textarea id="ans-${doc.id}" rows="2" placeholder="Nhập link bài làm hoặc code..."></textarea>
                <button onclick="submit('${doc.id}')" style="width:auto; font-size:14px; padding:10px 20px;">Nộp Bài</button>
            `;
            list.appendChild(div);
        });
    }

    window.submit = async (id) => {
        const val = document.getElementById(`ans-${id}`).value;
        if(!val) return alert("Chưa nhập bài làm!");
        await addDoc(collection(db, "submissions"), {
            qid: id, student: auth.currentUser.email, answer: val, time: serverTimestamp()
        });
        alert("Nộp thành công!");
    }
</script>
</body>
</html>
